services:
  - name: ipl-auction-frontend
    type: web
    env: node
    branch: main
    # npm ci installs exact versions from package-lock.json; includes devDependencies by default
    buildCommand: cd 1.2/ipl-auction-game/frontend && npm ci && npm run build
    startCommand: cd 1.2/ipl-auction-game/frontend && npm run preview
    envVars:
      - key: NODE_ENV
        value: production
    publishPath: 1.2/ipl-auction-game/frontend/dist

  - name: ipl-auction-backend
    type: web
    env: node
    branch: main
    buildCommand: cd 1.2/ipl-auction-game/backend && npm ci
    startCommand: cd 1.2/ipl-auction-game/backend && node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
