name: Node CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Backend: install & build
        if: always()
        working-directory: ipl-auction-game/backend
        run: |
          if [ -f package.json ]; then npm ci; npm run build --if-present; npm test --if-present; fi

      - name: Frontend: install & build
        if: always()
        working-directory: ipl-auction-game/frontend
        run: |
          if [ -f package.json ]; then npm ci; npm run build --if-present; npm test --if-present; fi
